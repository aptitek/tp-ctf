name: ecorp-ops

services:
  bastion:
    build:
      context: .
      dockerfile: docker/bastion.Dockerfile
    hostname: bastion
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    volumes:
      - ecorp-ssh-keys:/run/ecorp-keys
    networks:
      - ecorp-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 150
    healthcheck:
      test: ["CMD", "test", "-f", "/run/ecorp-keys/id_ed25519.pub"]
      interval: 10s
      timeout: 5s
      retries: 5

  zone-a-vitrine:
    build:
      context: .
      dockerfile: docker/zone-a.Dockerfile
    hostname: zone-a-vitrine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      bastion:
        condition: service_healthy
    volumes:
      - ecorp-ssh-keys:/run/ecorp-keys:ro
    networks:
      - ecorp-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 150
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  zone-b-rh:
    build:
      context: .
      dockerfile: docker/zone-b.Dockerfile
    hostname: zone-b-rh
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      bastion:
        condition: service_healthy
    volumes:
      - ecorp-ssh-keys:/run/ecorp-keys:ro
    networks:
      - ecorp-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 150
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  zone-c-vault:
    build:
      context: .
      dockerfile: docker/zone-c.Dockerfile
    hostname: zone-c-vault
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      bastion:
        condition: service_healthy
    volumes:
      - ecorp-ssh-keys:/run/ecorp-keys:ro
    networks:
      - ecorp-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 150
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  net-bridge:
    build:
      context: .
      dockerfile: docker/net-bridge.Dockerfile
    hostname: net-bridge
    profiles:
      - arena
    restart: unless-stopped
    init: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      bastion:
        condition: service_healthy
    volumes:
      - zt-identity:/var/lib/zerotier-one
    networks:
      - ecorp-net
      - arena-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 150
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/net-bridge.ready"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  ecorp-net:
    driver: bridge
    internal: true
  arena-net:
    driver: bridge

volumes:
  ecorp-ssh-keys:
  zt-identity:
